{% extends "base.html" %}
{% load static %}
{% block title %}Пароль сохранен{% endblock title %}

{% block main %}
    <div class="container">
        <div class="col-lg-5 mx-auto">
            <div class="card p-2 mt-3">
                <div class="card-body text-center">

                    <img src="{% static 'img/logo.svg' %}" alt="Pulse" width="140" height="40" class="d-block mx-auto mb-3">

                    <div class="icon-circle">
                        <i class="fa-solid fa-check fa-3x"></i>
                    </div>

                    <h2 class="card-title fw-semibold mb-4">Пароль изменен</h2>

                    <p class="text-body-secondary mb-3">Теперь вы можете зайти с новым паролем</p>

                    <a href="{% url "login" %}" class="btn btn-primary w-100">Перейти ко входу</a>
                </div>
            </div>
        </div>
    </div>
{% endblock main %}
